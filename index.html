<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUILD-A-BITCH | Step 1: Mobile Fitting</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #000; color: white; font-family: sans-serif; height: 100%; width: 100%; overflow: hidden; display: flex; flex-direction: column; touch-action: none; }
        #viewport { flex: 1; position: relative; background: #000; overflow: hidden; }
        #sidebar { width: 320px; background: #0a0a0c; border-left: 1px solid #1a1a1c; padding: 25px; z-index: 100; }
        .header { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 10; }
        .tag { font-size: 8px; font-weight: 900; color: #a855f7; letter-spacing: 0.5em; text-transform: uppercase; }
        .title { font-size: 20px; font-weight: 200; text-transform: uppercase; margin: 4px 0; }
        .group { margin-bottom: 25px; background: #111113; padding: 15px; border-radius: 16px; border: 1px solid #18181b; }
        .label { display: flex; justify-content: space-between; font-size: 10px; font-weight: 900; color: #aaa; }
        input[type="range"] { width: 100%; height: 8px; background: #27272a; border-radius: 4px; appearance: none; outline: none; margin: 10px 0; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 24px; height: 24px; background: #a855f7; border-radius: 50%; cursor: pointer; border: 3px solid #fff; }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #viewport { height: 65%; }
            #sidebar { width: 100%; height: 35%; border-left: none; border-top: 1px solid #18181b; box-sizing: border-box; }
        }
    </style>
</head>
<body>
    <div id="viewport">
        <div class="header">
            <div class="tag">Step 1: Mobile Phone Fitting</div>
            <div class="title">BUILD-A-BITCH</div>
        </div>
    </div>

    <div id="sidebar">
        <div class="group">
            <div class="label"><span>HEIGHT</span><span id="h-val">50%</span></div>
            <input type="range" id="height" min="0" max="100" value="50">
        </div>
        <div class="group">
            <div class="label"><span>WEIGHT / HIPS</span><span id="w-val">50%</span></div>
            <input type="range" id="weight" min="0" max="100" value="50">
        </div>
        <p style="font-size:9px; color:#444;">Optimized for Portrait Phone Screen. Swipe to spin 360.</p>
    </div>

    <script>
        const scene = new THREE.Scene();
        const container = document.getElementById('viewport');
        
        // MOBILE PORTRAIT CAMERA
        const camera = new THREE.PerspectiveCamera(25, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(0, 1.1, 4.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // 360 PIVOT CONTROL
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enablePan = false;
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;
        controls.target.set(0, 1.1, 0); // Focus on the model's torso
        controls.minDistance = 2.5;
        controls.maxDistance = 6.0;
        controls.update();

        scene.add(new THREE.AmbientLight(0xffffff, 1.5));
        const light = new THREE.DirectionalLight(0xffffff, 1.0); light.position.set(5, 10, 7); scene.add(light);

        const skinMat = new THREE.MeshStandardMaterial({ color: 0xf5d0c5, roughness: 0.4 });

        let model;
        const loader = new THREE.GLTFLoader();
        loader.load('https://raw.githubusercontent.com/PacktPublishing/Hands-On-Game-Programming/master/Chapter12/Woman.gltf', (gltf) => {
            model = gltf.scene;
            model.traverse(child => {
                if (child.isMesh) {
                    const name = child.name.toLowerCase();
                    if (name.includes('glasses') || name.includes('outfit') || name.includes('shoe')) {
                        child.visible = false;
                    } else {
                        child.material = skinMat;
                        child.visible = true;
                    }
                }
            });
            model.position.y = 0; 
            scene.add(model);
            animate();
        });

        const hInput = document.getElementById('height');
        const wInput = document.getElementById('weight');

        function animate() {
            requestAnimationFrame(animate);
            if (model) {
                // Fit to Phone Screen Scaling
                const hScale = 1.1 + (hInput.value / 100) * 0.5;
                const wScale = 1.1 + (wInput.value / 100) * 0.7;
                model.scale.set(wScale, hScale, wScale);
                
                document.getElementById('h-val').innerText = hInput.value + '%';
                document.getElementById('w-val').innerText = wInput.value + '%';
            }
            controls.update();
            renderer.render(scene, camera);
        }

        window.onresize = () => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        };
    </script>
</body>
</html>
