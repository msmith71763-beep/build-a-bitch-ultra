<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUILD-A-BITCH.COM | Build 54.0 Elite</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root { --primary: #7c3aed; --bg: #444444; --panel: #333333; --border: #555; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: white; font-family: sans-serif; height: 100%; width: 100%; overflow: hidden; display: flex; flex-direction: column; touch-action: none; }
        #main-container { display: flex; flex: 1; height: 100%; width: 100%; background: var(--bg); flex-direction: row; }
        #viewport { flex: 1; position: relative; background: var(--bg); overflow: hidden; }
        #sidebar { width: 350px; background: var(--panel); border-left: 2px solid var(--border); padding: 25px; overflow-y: auto; z-index: 100; box-shadow: -5px 0 20px rgba(0,0,0,0.3); box-sizing: border-box; }
        .header { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 10; }
        .tag { font-size: 10px; font-weight: 900; color: #fff; background: var(--primary); padding: 4px 10px; border-radius: 6px; letter-spacing: 0.1em; text-transform: uppercase; display: inline-block; }
        .title { font-size: 24px; font-weight: 800; text-transform: uppercase; margin: 10px 0; color: #eee; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .tab-bar { display: flex; gap: 8px; margin-bottom: 25px; overflow-x: auto; padding-bottom: 12px; }
        .tab-btn { padding: 12px 16px; background: #444; border: 1px solid #555; color: #ccc; border-radius: 12px; cursor: pointer; font-size: 10px; font-weight: 800; text-transform: uppercase; flex-shrink: 0; }
        .tab-btn.active { background: var(--primary); border-color: var(--primary); color: white; }
        .control-group { margin-bottom: 20px; background: #3d3d3d; padding: 18px; border-radius: 16px; border: 1px solid #555; }
        .label { display: flex; justify-content: space-between; font-size: 10px; font-weight: 900; margin-bottom: 12px; color: #bbb; letter-spacing: 0.1em; }
        .label span:last-child { color: #fff; background: var(--primary); padding: 0 6px; border-radius: 4px; }
        input[type="range"] { width: 100%; height: 6px; background: #555; border-radius: 3px; appearance: none; outline: none; margin: 10px 0; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 28px; height: 28px; background: var(--primary); border-radius: 50%; cursor: pointer; border: 3px solid #fff; }
        .grid-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .opt-btn { padding: 16px; background: #444; border: 1px solid #555; color: #ccc; font-size: 10px; font-weight: 800; text-transform: uppercase; border-radius: 12px; cursor: pointer; }
        .opt-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        @media (max-width: 768px) {
            #main-container { flex-direction: column; }
            #sidebar { width: 100%; height: 45%; border-left: none; border-top: 2px solid var(--border); }
            #viewport { height: 55%; flex: none; }
        }
    </style>
</head>
<body>
    <div id="main-container">
        <div id="viewport">
            <div class="header">
                <div class="tag">Final Build 54.0 - Solid Gray</div>
                <div class="title">BUILD-A-BITCH.COM</div>
            </div>
        </div>
        <div id="sidebar">
            <div class="tab-bar" id="tabs"></div>
            <div id="controls-area"></div>
            <div style="margin-top: 20px; font-size: 9px; color: #777; text-align: center;">
                Use Incognito/Private mode to bypass cache.
            </div>
        </div>
    </div>

    <script>
        const state = {
            body: { height: 50, weight: 85, hips: 70 },
            chest: { size: 10 },
            anatomy: { vagina: 'Type 2' },
            hair: { color: 'red' },
            skin: { preset: 'caucasian' }
        };

        const config = [
            { id: 'body', label: 'Body', fields: ['height', 'weight', 'hips'] },
            { id: 'chest', label: 'Breasts', fields: ['size'] },
            { id: 'anatomy', label: 'Anatomy', options: ['Type 1', 'Type 2', 'Type 3', 'Type 4', 'Type 5', 'Type 6'] },
            { id: 'hair', label: 'Hair', options: ['black', 'blonde', 'red', 'brown'] },
            { id: 'skin', label: 'Skin', options: ['caucasian', 'african', 'east_asian', 'latin'] }
        ];

        const SKIN_PRESETS = { caucasian: "#f5d0c5", african: "#3d2b1f", east_asian: "#f3e0b5", latin: "#c68642" };
        const HAIR_COLORS = { black: "#090909", blonde: "#e6c073", red: "#9a3324", brown: "#4b3221" };

        let activeCat = 'body';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x444444);
        
        const container = document.getElementById('viewport');
        const camera = new THREE.PerspectiveCamera(35, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(0, 1.2, 3.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enablePan = false;
        controls.target.set(0, 0.9, 0);
        controls.minDistance = 2;
        controls.maxDistance = 10;

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);
        const backLight = new THREE.DirectionalLight(0xffffff, 0.4);
        backLight.position.set(-5, 5, -5);
        scene.add(backLight);

        const skinMat = new THREE.MeshStandardMaterial({ roughness: 0.6, metalness: 0.1 });
        const hairMat = new THREE.MeshStandardMaterial({ roughness: 0.8 });
        
        const bodyGroup = new THREE.Group();
        scene.add(bodyGroup);

        const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 64, 64), skinMat);
        head.position.y = 1.55;

        const torso = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 64), skinMat);
        torso.scale.set(0.35, 0.6, 0.28);
        torso.position.y = 0.95;

        const hips = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 64), skinMat);
        hips.scale.set(0.4, 0.35, 0.3);
        hips.position.y = 0.45;

        const breastL = new THREE.Mesh(new THREE.SphereGeometry(0.12, 48, 48), skinMat);
        const breastR = new THREE.Mesh(new THREE.SphereGeometry(0.12, 48, 48), skinMat);
        
        const vagina = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 48), skinMat);
        vagina.scale.set(0.08, 0.16, 0.06); 
        vagina.position.set(0, 0.25, 0.3); 
        vagina.rotation.x = -0.15;

        const legL = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 48), skinMat);
        const legR = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 48), skinMat);
        legL.scale.set(0.12, 0.5, 0.12); legL.position.set(-0.16, -0.05, 0);
        legR.scale.set(0.12, 0.5, 0.12); legR.position.set(0.16, -0.05, 0);

        const hair = new THREE.Mesh(new THREE.SphereGeometry(0.3, 48, 48), hairMat);
        hair.scale.set(1, 1.2, 1.1);
        hair.position.set(0, 1.6, -0.05);

        bodyGroup.add(head, torso, hips, breastL, breastR, vagina, legL, legR, hair);
        bodyGroup.position.y = -0.3;

        function animate() {
            requestAnimationFrame(animate);
            
            const scaleFactor = 0.85 + (state.body.height / 100) * 0.3;
            const weightFactor = 0.8 + (state.body.weight / 100) * 0.8;
            const hipFactor = 0.7 + (state.body.hips / 100) * 0.6;
            
            bodyGroup.scale.set(scaleFactor, scaleFactor, scaleFactor);
            
            hips.scale.x = 0.4 * hipFactor * weightFactor;
            torso.scale.x = 0.35 * (1 + (weightFactor - 1) * 0.4);
            
            const bSize = 0.6 + (state.chest.size / 15) * 1.5;
            breastL.scale.setScalar(bSize);
            breastR.scale.setScalar(bSize);
            
            const xPos = 0.15 * weightFactor;
            const zPos = 0.22 + (state.chest.size / 15) * 0.18;
            breastL.position.set(-xPos, 1.05, zPos);
            breastR.position.set(xPos, 1.05, zPos);

            legL.position.x = -0.16 * hipFactor;
            legR.position.x = 0.16 * hipFactor;

            // Vagina Type visual logic
            const vType = parseInt(state.anatomy.vagina.split(' ')[1]);
            vagina.scale.y = 0.16 + (vType * 0.01);
            vagina.scale.x = 0.08 + (vType * 0.005);

            skinMat.color.set(SKIN_PRESETS[state.skin.preset]);
            hairMat.color.set(HAIR_COLORS[state.hair.color]);

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        function renderUI() {
            const tabs = document.getElementById('tabs');
            const area = document.getElementById('controls-area');
            tabs.innerHTML = ''; area.innerHTML = '';
            
            config.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (activeCat === c.id ? ' active' : '');
                btn.innerText = c.label;
                btn.onclick = () => { activeCat = c.id; renderUI(); };
                tabs.appendChild(btn);
            });

            const current = config.find(c => c.id === activeCat);
            if (current.fields) {
                current.fields.forEach(f => {
                    const div = document.createElement('div');
                    div.className = 'control-group';
                    const max = (f === 'size' && activeCat === 'chest') ? 15 : 100;
                    const val = state[activeCat][f];
                    div.innerHTML = `<div class="label"><span>${f.toUpperCase()}</span><span>${val}${max===100?'%':''}</span></div>
                        <input type="range" min="0" max="${max}" value="${val}" oninput="state.${activeCat}.${f}=this.value; renderUI();">`;
                    area.appendChild(div);
                });
            } else {
                const div = document.createElement('div');
                div.className = 'grid-options';
                current.options.forEach(opt => {
                    const btn = document.createElement('button');
                    const isSel = (state.skin.preset === opt || state.hair.color === opt || state.anatomy.vagina === opt);
                    btn.className = 'opt-btn' + (isSel ? ' active' : '');
                    btn.innerText = opt;
                    btn.onclick = () => {
                        if(activeCat === 'skin') state.skin.preset = opt;
                        else if(activeCat === 'hair') state.hair.color = opt;
                        else if(activeCat === 'anatomy') state.anatomy.vagina = opt;
                        renderUI();
                    };
                    div.appendChild(btn);
                });
                area.appendChild(div);
            }
        }
        renderUI();

        window.onresize = () => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            renderer.setSize(w, h);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        };
    </script>
</body>
</html>
