<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUILD-A-BITCH.COM | Build 51.0 Fixed</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root { --primary: #a855f7; --bg: #333333; --panel: #1a1a1c; --border: #444; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: white; font-family: sans-serif; height: 100%; width: 100%; overflow: hidden; display: flex; flex-direction: column; touch-action: none; }
        #viewport { flex: 1; position: relative; background: #333333; }
        #sidebar { width: 320px; background: var(--panel); border-left: 1px solid var(--border); padding: 20px; overflow-y: auto; z-index: 100; }
        .header { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 10; }
        .tag { font-size: 8px; font-weight: 900; color: #fff; background: var(--primary); padding: 2px 6px; border-radius: 4px; letter-spacing: 0.1em; text-transform: uppercase; }
        .title { font-size: 20px; font-weight: 800; text-transform: uppercase; margin: 8px 0; color: white; }
        .tab-bar { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 10px; }
        .tab-btn { padding: 10px 14px; background: #2a2a2e; border: 1px solid #444; color: #bbb; border-radius: 8px; cursor: pointer; font-size: 9px; font-weight: 800; text-transform: uppercase; flex-shrink: 0; }
        .tab-btn.active { background: #7c3aed; color: white; border-color: #a855f7; }
        .group { margin-bottom: 20px; background: #222226; padding: 12px; border-radius: 12px; border: 1px solid #333; }
        .label { display: flex; justify-content: space-between; font-size: 9px; font-weight: 900; margin-bottom: 10px; color: #ddd; }
        .label span:last-child { color: var(--primary); }
        input[type="range"] { width: 100%; height: 6px; background: #444; border-radius: 3px; appearance: none; outline: none; margin: 10px 0; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 24px; height: 24px; background: var(--primary); border-radius: 50%; cursor: pointer; border: 3px solid #fff; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .opt-btn { padding: 12px; background: #2a2a2e; border: 1px solid #444; color: #ddd; font-size: 9px; font-weight: 800; text-transform: uppercase; border-radius: 10px; cursor: pointer; }
        .opt-btn.active { background: #7c3aed; color: white; }
        #load-screen { position: fixed; inset: 0; background: #333; z-index: 1000; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #viewport { height: 60%; }
            #sidebar { width: 100%; height: 40%; border-left: none; border-top: 1px solid var(--border); box-sizing: border-box; }
        }
    </style>
</head>
<body>
    <div id="load-screen">
        <div style="color:white; font-weight:bold; font-size:14px;">DEPLOYING BUILD 51.0...</div>
        <div id="status" style="font-size:10px; color:#aaa; margin-top:10px;">CLEANING CACHE...</div>
    </div>

    <div id="viewport">
        <div class="header">
            <div class="tag">Master Build 51.0 - Gray Studio</div>
            <div class="title">BUILD-A-BITCH.COM</div>
        </div>
    </div>

    <div id="sidebar">
        <div class="tab-bar" id="tabs"></div>
        <div id="controls"></div>
    </div>

    <script>
        const state = {
            body: { height: 50, weight: 80 },
            chest: { size: 10 },
            hair: { color: 'red' },
            eyes: { color: 'green' },
            skin: { preset: 'caucasian' },
            anatomy: { vagina: 'Type 2' }
        };

        const config = [
            { id: 'body', label: 'Body', fields: ['height', 'weight'] },
            { id: 'chest', label: 'Breasts', fields: ['size'] },
            { id: 'anatomy', label: 'Anatomy', options: ['Vagina 1', 'Vagina 2', 'Vagina 3', 'Vagina 4'] },
            { id: 'hair', label: 'Hair', options: ['black', 'blonde', 'red', 'brown'] },
            { id: 'skin', label: 'Skin Tone', options: ['caucasian', 'african', 'east_asian', 'latin'] }
        ];

        const PRESETS = {
            skin: { caucasian: "#f5d0c5", african: "#3d2b1f", east_asian: "#f3e0b5", latin: "#c68642" },
            hair: { black: "#090909", blonde: "#e6c073", red: "#9a3324", brown: "#4b3221" }
        };

        let activeCat = 'body'; let model; let controls;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x333333);
        const container = document.getElementById('viewport');
        const camera = new THREE.PerspectiveCamera(30, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(0, 0.8, 4.0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enablePan = false; controls.target.set(0, 0.9, 0); 

        scene.add(new THREE.AmbientLight(0xffffff, 1.3));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(5, 10, 7); scene.add(sun);

        const skinMat = new THREE.MeshPhysicalMaterial({ roughness: 0.3, clearcoat: 0.1, sheen: 0.6 });
        const hairMat = new THREE.MeshStandardMaterial({ roughness: 0.8 });
        const pinkMat = new THREE.MeshStandardMaterial({ color: 0xff7777 });

        // Guaranteed Visible Anatomy
        const breastL = new THREE.Mesh(new THREE.SphereGeometry(0.12, 64, 64), skinMat);
        const breastR = new THREE.Mesh(new THREE.SphereGeometry(0.12, 64, 64), skinMat);
        const vagina = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), skinMat);
        vagina.scale.set(0.08, 0.18, 0.05);
        
        const loader = new THREE.GLTFLoader();
        // FORCING RELIABLE 2.8MB MODEL
        loader.load('https://raw.githubusercontent.com/PacktPublishing/Hands-On-Game-Animation-Programming/master/AllChapters/Assets/Woman.gltf?v=51', (gltf) => {
            model = gltf.scene;
            model.traverse(child => {
                if (child.isMesh) {
                    const name = child.name.toLowerCase();
                    // Only hide true outfit pieces
                    if (name.includes('glasses') || name.includes('outfit') || name.includes('shoe')) {
                        child.visible = false;
                    } else {
                        child.material = name.includes('hair') ? hairMat : skinMat;
                        child.visible = true;
                        child.frustumCulled = false;
                    }
                }
            });
            model.position.y = -1.2; scene.add(model);
            
            // Anchor anatomy
            model.add(breastL); model.add(breastR); model.add(vagina);
            
            document.getElementById('load-screen').remove();
            animate();
        }, (xhr) => {
            document.getElementById('status').innerText = 'LOADING ASSETS: ' + Math.round((xhr.loaded / xhr.total) * 100) + '%';
        });

        function animate() {
            requestAnimationFrame(animate);
            if (model) {
                model.rotation.y += 0.005;
                const h = 0.9 + (state.body.height / 100) * 0.25;
                const w = 0.85 + (state.body.weight / 100) * 0.8; 
                model.scale.set(w, h, w);
                
                const bSize = 0.6 + (state.chest.size / 15) * 1.5;
                breastL.scale.setScalar(bSize); breastR.scale.setScalar(bSize);
                breastL.position.set(-0.16, 2.0, 0.22); breastR.position.set(0.16, 2.0, 0.22);
                vagina.position.set(0, 1.4, 0.35); vagina.rotation.x = -0.2;
            }
            skinMat.color.set(PRESETS.skin[state.skin.preset]);
            hairMat.color.set(PRESETS.hair[state.hair.color]);
            renderer.render(scene, camera);
        }

        function renderUI() {
            const tabs = document.getElementById('tabs'); const ctrls = document.getElementById('controls');
            tabs.innerHTML = ''; ctrls.innerHTML = '';
            config.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (activeCat === c.id ? ' active' : '');
                btn.innerText = c.label; btn.onclick = () => { activeCat = c.id; renderUI(); };
                tabs.appendChild(btn);
            });
            const current = config.find(c => c.id === activeCat);
            if (current.fields) {
                current.fields.forEach(f => {
                    const div = document.createElement('div'); div.className = 'group';
                    div.innerHTML = `<div class="label"><span>${f.toUpperCase()}</span><span>${state[activeCat][f]}%</span></div>
                                     <input type="range" min="0" max="100" value="${state[activeCat][f]}" oninput="state.${activeCat}.${f}=this.value; renderUI();">`;
                    ctrls.appendChild(div);
                });
            } else {
                const div = document.createElement('div'); div.className = 'grid';
                current.options.forEach(opt => {
                    const btn = document.createElement('button');
                    const isSel = (state.skin.preset === opt || state.hair.color === opt || state.eyes.color === opt || state.anatomy.vagina === opt);
                    btn.className = 'opt-btn' + (isSel ? ' active' : '');
                    btn.innerText = opt; btn.onclick = () => {
                        if(activeCat === 'skin') state.skin.preset = opt;
                        else if(activeCat === 'hair') state.hair.color = opt;
                        else if(activeCat === 'eyes') state.eyes.color = opt;
                        else if(activeCat === 'anatomy') state.anatomy.vagina = opt;
                        renderUI();
                    };
                    div.appendChild(btn);
                });
                ctrls.appendChild(div);
            }
        }
        renderUI();
        window.onresize = () => {
            camera.aspect = container.clientWidth / container.clientHeight; camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        };
    </script>
</body>
</html>
