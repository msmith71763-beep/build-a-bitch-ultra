<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUILD-A-BITCH.COM | Masterpiece Build</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #050507; color: white; font-family: sans-serif; height: 100%; width: 100%; overflow: hidden; display: flex; flex-direction: column; touch-action: none; }
        #viewport { flex: 1; position: relative; background: radial-gradient(circle at center, #1a1a2e 0%, #050507 100%); }
        #sidebar { width: 350px; background: #09090b; border-left: 1px solid #1a1a1c; padding: 25px; overflow-y: auto; z-index: 100; box-shadow: -10px 0 30px rgba(0,0,0,0.5); }
        .header { position: absolute; top: 30px; left: 30px; pointer-events: none; z-index: 10; }
        .tag { font-size: 9px; font-weight: 900; color: #a855f7; letter-spacing: 0.5em; text-transform: uppercase; opacity: 0.8; }
        .title { font-size: 24px; font-weight: 200; text-transform: uppercase; margin: 5px 0; letter-spacing: 0.1em; }
        .title b { color: #a855f7; font-weight: 800; }
        .tab-bar { display: flex; gap: 8px; margin-bottom: 30px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
        .tab-btn { padding: 12px 18px; background: #18181b; border: 1px solid #27272a; color: #71717a; border-radius: 12px; cursor: pointer; font-size: 10px; font-weight: 800; text-transform: uppercase; transition: all 0.2s; flex-shrink: 0; }
        .tab-btn.active { background: #7c3aed; color: white; border-color: #a855f7; }
        .control-group { margin-bottom: 30px; background: #111113; padding: 15px; border-radius: 16px; border: 1px solid #18181b; }
        .label { display: flex; justify-content: space-between; font-size: 10px; font-weight: 900; margin-bottom: 12px; color: #a1a1aa; }
        .label span:last-child { color: #a855f7; }
        input[type="range"] { width: 100%; height: 4px; background: #27272a; border-radius: 2px; appearance: none; outline: none; margin: 10px 0; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 22px; height: 22px; background: #a855f7; border-radius: 50%; cursor: pointer; border: 3px solid #fff; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .opt-btn { padding: 16px; background: #18181b; border: 1px solid #27272a; color: #a1a1aa; font-size: 10px; font-weight: 800; text-transform: uppercase; border-radius: 12px; cursor: pointer; }
        .opt-btn.active { background: #7c3aed; color: white; border-color: #a855f7; }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: 45%; border-left: none; border-top: 1px solid #18181b; box-sizing: border-box; }
            #viewport { height: 55%; }
        }
    </style>
</head>
<body>
    <div id="viewport">
        <div class="header">
            <div class="tag">Final Master Build - All Options Verified</div>
            <div class="title">BUILD-A-<b>BITCH</b></div>
        </div>
    </div>
    <div id="sidebar">
        <div class="tab-bar" id="tabs"></div>
        <div id="controls-area"></div>
    </div>

    <script>
        // --- DATA ---
        const state = {
            body: { height: 50, weight: 85, muscle: 50 },
            chest: { size: 10, type: 'Natural' },
            anatomy: { vagina: 'Type 2', bush: 'Natural' },
            hair: { color: 'red', style: 'Long' },
            eyes: { color: 'green' },
            skin: { preset: 'caucasian' }
        };

        const config = [
            { id: 'body', label: 'Proportions', fields: ['height', 'weight', 'muscle'] },
            { id: 'chest', label: 'Breasts', fields: ['size'], options: ['Natural', 'Perky', 'Firm'] },
            { id: 'anatomy', label: 'Anatomy', options: ['Vagina 1', 'Vagina 2', 'Vagina 3', 'Shaved', 'Natural', 'Bush'] },
            { id: 'hair', label: 'Hair', options: ['black', 'blonde', 'red', 'brown'] },
            { id: 'eyes', label: 'Eyes', options: ['brown', 'blue', 'green', 'hazel'] },
            { id: 'skin', label: 'Skin Tone', options: ['caucasian', 'african', 'east_asian', 'latin'] }
        ];

        const PRESETS = {
            skin: { caucasian: "#f5d0c5", african: "#3d2b1f", east_asian: "#f3e0b5", latin: "#c68642" },
            hair: { black: "#090909", blonde: "#e6c073", red: "#9a3324", brown: "#4b3221" },
            eyes: { brown: "#5c3317", blue: "#4a90d9", green: "#2d5a27", hazel: "#8b7355" }
        };

        let activeCat = 'body';

        // --- ENGINE ---
        const scene = new THREE.Scene();
        const container = document.getElementById('viewport');
        const camera = new THREE.PerspectiveCamera(30, container.clientWidth / container.clientHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const light = new THREE.DirectionalLight(0xffffff, 1.5);
        light.position.set(5, 10, 7); scene.add(light);

        const skinMat = new THREE.MeshPhysicalMaterial({ roughness: 0.3, clearcoat: 0.2, sheen: 0.8, sheenColor: 0xffdbd1 });
        const hairMat = new THREE.MeshStandardMaterial({ color: 0x9a3324, roughness: 0.8 });
        const pinkMat = new THREE.MeshStandardMaterial({ color: 0xff7777, roughness: 0.3 });

        const bodyGroup = new THREE.Group();
        
        // Ultra-Smooth V3 Restoration Engine
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 64, 64), skinMat); head.position.y = 1.55;
        const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.35, 0.8, 64), skinMat); torso.position.y = 0.6;
        
        const breastL = new THREE.Mesh(new THREE.SphereGeometry(0.12, 64, 64), skinMat);
        const breastR = new THREE.Mesh(new THREE.SphereGeometry(0.12, 64, 64), skinMat);
        const nipL = new THREE.Mesh(new THREE.SphereGeometry(0.015, 32, 32), pinkMat);
        const nipR = new THREE.Mesh(new THREE.SphereGeometry(0.015, 32, 32), pinkMat);

        const vagina = new THREE.Group();
        const labia = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 64), skinMat); labia.scale.set(0.06, 0.15, 0.04);
        const slit = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), pinkMat); slit.scale.set(0.01, 0.1, 0.02); slit.position.z = 0.035;
        vagina.add(labia, slit); vagina.position.set(0, 0.22, 0.33); vagina.rotation.x = -0.25;

        const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.08, 0.75, 32), skinMat);
        const legR = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.08, 0.75, 32), skinMat);
        
        const hairMesh = new THREE.Mesh(new THREE.SphereGeometry(0.28, 64, 64), hairMat); hairMesh.scale.set(1, 1.4, 0.9); hairMesh.position.set(0, 1.6, 0);

        bodyGroup.add(head, torso, breastL, breastR, nipL, nipR, vagina, legL, legR, hairMesh);
        scene.add(bodyGroup); bodyGroup.position.y = -0.3;
        camera.position.set(0, 1.3, 4.5);
        camera.lookAt(0, 0.8, 0);

        function animate() {
            requestAnimationFrame(animate);
            bodyGroup.rotation.y += 0.005;
            
            const h = 0.85 + (state.body.height / 100) * 0.3;
            const w = 0.8 + (state.body.weight / 100) * 0.75; 
            bodyGroup.scale.set(h, h, h);
            torso.scale.set(w, 1, 0.95);
            
            const bSize = 0.12 + (state.chest.size / 15) * 0.25;
            breastL.scale.setScalar(bSize/0.12); breastR.scale.setScalar(bSize/0.12);
            const xPos = 0.16 * w; const zPos = 0.22 + (state.chest.size / 15) * 0.15;
            breastL.position.set(-xPos, 0.8, zPos); breastR.position.set(xPos, 0.8, zPos);
            nipL.position.set(-xPos, 0.8, zPos + bSize - 0.01); nipR.position.set(xPos, 0.8, zPos + bSize - 0.01);
            
            legL.position.set(-0.16 * w, -0.15, 0); legR.position.set(0.16 * w, -0.15, 0);

            skinMat.color.set(PRESETS.skin[state.skin.preset]);
            hairMat.color.set(PRESETS.hair[state.hair.color]);
            renderer.render(scene, camera);
        }
        animate();

        function renderUI() {
            const tabs = document.getElementById('tabs'); const area = document.getElementById('controls-area');
            tabs.innerHTML = ''; area.innerHTML = '';

            config.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (activeCat === c.id ? ' active' : '');
                btn.innerText = c.label; btn.onclick = () => { activeCat = c.id; renderUI(); };
                tabs.appendChild(btn);
            });

            const current = config.find(c => c.id === activeCat);
            if (current.fields) {
                current.fields.forEach(f => {
                    const div = document.createElement('div'); div.className = 'control-group';
                    div.innerHTML = `<div class="label"><span>${f.toUpperCase()}</span><span>${state[activeCat][f]}%</span></div>
                                     <input type="range" min="0" max="100" value="${state[activeCat][f]}" oninput="state.${activeCat}.${f}=this.value; this.parentElement.querySelector('.label span:last-child').innerText = this.value + '%';">`;
                    area.appendChild(div);
                });
            } else {
                const div = document.createElement('div'); div.className = 'grid';
                current.options.forEach(opt => {
                    const btn = document.createElement('button');
                    const isSel = (state.skin.preset === opt || state.hair.color === opt || state.eyes.color === opt || state.anatomy.vagina === opt);
                    btn.className = 'opt-btn' + (isSel ? ' active' : '');
                    btn.innerText = opt; btn.onclick = () => {
                        if(activeCat === 'skin') state.skin.preset = opt;
                        else if(activeCat === 'hair') state.hair.color = opt;
                        else if(activeCat === 'eyes') state.eyes.color = opt;
                        else if(activeCat === 'anatomy') state.anatomy.vagina = opt;
                        renderUI();
                    };
                    div.appendChild(btn);
                });
                area.appendChild(div);
            }
        }
        renderUI();

        window.onresize = () => {
            const w = container.clientWidth; const h = container.clientHeight;
            renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
        };
    </script>
</body>
</html>
