<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUILD-A-BITCH.COM | Build 57.2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        :root { --primary: #7c3aed; --bg: #444444; --panel: #333333; --border: #555; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: white; font-family: sans-serif; height: 100%; width: 100%; overflow: hidden; display: flex; flex-direction: column; touch-action: none; }
        #main-container { display: flex; flex: 1; height: 100%; width: 100%; background: var(--bg); flex-direction: row; }
        #viewport { flex: 1; position: relative; background: var(--bg); overflow: hidden; }
        #sidebar { width: 350px; background: var(--panel); border-left: 2px solid var(--border); padding: 25px; overflow-y: auto; z-index: 100; box-shadow: -5px 0 20px rgba(0,0,0,0.3); box-sizing: border-box; }
        .header { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 10; }
        .tag { font-size: 10px; font-weight: 900; color: #fff; background: var(--primary); padding: 4px 10px; border-radius: 6px; letter-spacing: 0.1em; text-transform: uppercase; display: inline-block; }
        .title { font-size: 24px; font-weight: 800; text-transform: uppercase; margin: 10px 0; color: #eee; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .tab-bar { display: flex; gap: 8px; margin-bottom: 25px; overflow-x: auto; padding-bottom: 12px; }
        .tab-btn { padding: 12px 16px; background: #444; border: 1px solid #555; color: #ccc; border-radius: 12px; cursor: pointer; font-size: 10px; font-weight: 800; text-transform: uppercase; flex-shrink: 0; }
        .tab-btn.active { background: var(--primary); border-color: var(--primary); color: white; }
        .control-group { margin-bottom: 20px; background: #3d3d3d; padding: 18px; border-radius: 16px; border: 1px solid #555; }
        .label { display: flex; justify-content: space-between; font-size: 10px; font-weight: 900; margin-bottom: 12px; color: #bbb; letter-spacing: 0.1em; }
        .label span:last-child { color: #fff; background: var(--primary); padding: 0 6px; border-radius: 4px; }
        input[type="range"] { width: 100%; height: 6px; background: #555; border-radius: 3px; appearance: none; outline: none; margin: 10px 0; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 28px; height: 28px; background: var(--primary); border-radius: 50%; cursor: pointer; border: 3px solid #fff; }
        .grid-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .opt-btn { padding: 16px; background: #444; border: 1px solid #555; color: #ccc; font-size: 10px; font-weight: 800; text-transform: uppercase; border-radius: 12px; cursor: pointer; }
        .opt-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #7c3aed; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; z-index: 1000; font-size: 14px; text-align: center; }
        #loading .bar-wrap { width: 200px; height: 6px; background: #333; border-radius: 3px; margin: 12px auto 0; overflow: hidden; }
        #loading .bar-fill { height: 100%; width: 0%; background: #7c3aed; border-radius: 3px; transition: width 0.2s; }
        @media (max-width: 768px) {
            #main-container { flex-direction: column; }
            #sidebar { width: 100%; height: 45%; border-left: none; border-top: 2px solid var(--border); }
            #viewport { height: 55%; flex: none; }
        }
    </style>
</head>
<body>
    <div id="main-container">
        <div id="viewport">
            <div id="loading">
                <div id="loading-text">DOWNLOADING 0%</div>
                <div class="bar-wrap"><div class="bar-fill" id="loading-bar"></div></div>
            </div>
            <div class="header">
                <div class="tag">Build 57.2 - Micro Chunks</div>
                <div class="title">BUILD-A-BITCH.COM</div>
            </div>
        </div>
        <div id="sidebar">
            <div class="tab-bar" id="tabs"></div>
            <div id="controls-area"></div>
            <div style="margin-top: 20px; font-size: 9px; color: #777; text-align: center;">
                Build 57.2 | 70-chunk streaming load
            </div>
        </div>
    </div>

    <script>
        const state = {
            body: { height: 50, weight: 85, hips: 70 },
            chest: { size: 10 },
            anatomy: { vagina: 'Type 2' },
            hair: { color: 'red' },
            skin: { preset: 'caucasian' }
        };

        const config = [
            { id: 'body', label: 'Body', fields: ['height', 'weight', 'hips'] },
            { id: 'chest', label: 'Breasts', fields: ['size'] },
            { id: 'anatomy', label: 'Anatomy', options: ['Type 1', 'Type 2', 'Type 3', 'Type 4', 'Type 5', 'Type 6'] },
            { id: 'hair', label: 'Hair', options: ['black', 'blonde', 'red', 'brown'] },
            { id: 'skin', label: 'Skin', options: ['caucasian', 'african', 'east_asian', 'latin'] }
        ];

        const SKIN_PRESETS = { caucasian: "#f5d0c5", african: "#3d2b1f", east_asian: "#f3e0b5", latin: "#c68642" };
        const HAIR_COLORS = { black: "#090909", blonde: "#e6c073", red: "#9a3324", brown: "#4b3221" };

        let activeCat = 'body';
        let model, hipBone;
        let skinMeshes = [], hairMeshes = [], breastNodes = [];

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x444444);

        const container = document.getElementById('viewport');
        const camera = new THREE.PerspectiveCamera(30, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(0, 1.2, 4.2);

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enablePan = false;
        controls.target.set(0, 0.9, 0);
        controls.minDistance = 1.8;
        controls.maxDistance = 6;

        scene.add(new THREE.AmbientLight(0xffffff, 1.1));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const loadingDiv = document.getElementById('loading');
        const loadingText = document.getElementById('loading-text');
        const loadingBar = document.getElementById('loading-bar');

        const TOTAL_CHUNKS = 70;
        const BASE_URL = 'model/';

        function pad(n) { return String(n).padStart(3, '0'); }

        async function fetchChunk(index) {
            const url = BASE_URL + 'c' + pad(index) + '.bin';
            const resp = await fetch(url);
            if (!resp.ok) throw new Error('Failed to fetch chunk ' + index + ': ' + resp.status);
            return await resp.arrayBuffer();
        }

        async function loadModelFromChunks() {
            try {
                loadingText.innerText = 'DOWNLOADING 0%';
                loadingBar.style.width = '0%';

                const chunks = [];
                let loaded = 0;

                // Download in batches of 5 for speed but not overwhelming mobile
                const batchSize = 5;
                for (let i = 0; i < TOTAL_CHUNKS; i += batchSize) {
                    const batch = [];
                    for (let j = i; j < Math.min(i + batchSize, TOTAL_CHUNKS); j++) {
                        batch.push(fetchChunk(j + 1));
                    }
                    const results = await Promise.all(batch);
                    results.forEach(buf => {
                        chunks.push(buf);
                        loaded++;
                        const pct = Math.round((loaded / TOTAL_CHUNKS) * 100);
                        loadingText.innerText = 'DOWNLOADING ' + pct + '%';
                        loadingBar.style.width = pct + '%';
                    });
                }

                loadingText.innerText = 'ASSEMBLING MODEL...';

                // Combine all chunks into one ArrayBuffer
                let totalSize = 0;
                chunks.forEach(c => totalSize += c.byteLength);
                const combined = new Uint8Array(totalSize);
                let offset = 0;
                chunks.forEach(c => {
                    combined.set(new Uint8Array(c), offset);
                    offset += c.byteLength;
                });

                loadingText.innerText = 'PARSING 3D MESH...';

                // Parse the assembled GLB/glTF data
                const loader = new THREE.GLTFLoader();
                loader.parse(combined.buffer, '', function(gltf) {
                    model = gltf.scene;
                    scene.add(model);
                    loadingDiv.style.display = 'none';

                    model.traverse(function(node) {
                        if (node.isMesh) {
                            node.material.roughness = 0.6;
                            node.material.metalness = 0.0;
                            if (node.name.includes('Outfit') || node.name.includes('Glasses') || node.name.includes('Teeth')) {
                                node.visible = false;
                            }
                            if (node.name.includes('Skin') || node.name.includes('Body') || node.name.includes('Head') || node.name.includes('Eye')) {
                                skinMeshes.push(node);
                            }
                            if (node.name.includes('Hair')) {
                                hairMeshes.push(node);
                            }
                        }
                        if (node.name === 'Hips') hipBone = node;
                        if (node.name.toLowerCase().includes('breast')) breastNodes.push(node);
                    });
                    animate();
                }, function(err) {
                    console.error('Parse error:', err);
                    loadingText.innerText = 'PARSE ERROR - PLEASE REFRESH';
                });

            } catch (e) {
                console.error('Load error:', e);
                loadingText.innerText = 'LOAD ERROR - PLEASE REFRESH';
            }
        }

        loadModelFromChunks();

        function animate() {
            requestAnimationFrame(animate);
            if (model) {
                var sHeight = 0.88 + (state.body.height / 100) * 0.24;
                var sWeight = 0.82 + (state.body.weight / 100) * 0.36;
                var sHips = 0.75 + (state.body.hips / 100) * 0.5;
                model.scale.set(sWeight, sHeight, 1.0);
                if (hipBone) hipBone.scale.x = sHips;
                var bScale = 0.85 + (state.chest.size / 15) * 1.4;
                breastNodes.forEach(function(node) { node.scale.setScalar(bScale); });
                var skinColor = new THREE.Color(SKIN_PRESETS[state.skin.preset]);
                skinMeshes.forEach(function(mesh) { if(mesh.material) mesh.material.color.copy(skinColor); });
                var hairColor = new THREE.Color(HAIR_COLORS[state.hair.color]);
                hairMeshes.forEach(function(mesh) { if(mesh.material) mesh.material.color.copy(hairColor); });
            }
            controls.update();
            renderer.render(scene, camera);
        }

        function renderUI() {
            var tabs = document.getElementById('tabs');
            var area = document.getElementById('controls-area');
            tabs.innerHTML = ''; area.innerHTML = '';
            config.forEach(function(c) {
                var btn = document.createElement('button');
                btn.className = 'tab-btn' + (activeCat === c.id ? ' active' : '');
                btn.innerText = c.label;
                btn.onclick = function() { activeCat = c.id; renderUI(); };
                tabs.appendChild(btn);
            });
            var current = config.find(function(c) { return c.id === activeCat; });
            if (current.fields) {
                current.fields.forEach(function(f) {
                    var div = document.createElement('div');
                    div.className = 'control-group';
                    var max = (f === 'size' && activeCat === 'chest') ? 15 : 100;
                    var val = state[activeCat][f];
                    div.innerHTML = '<div class="label"><span>' + f.toUpperCase() + '</span><span>' + val + (max===100?"%":"") + '</span></div>' +
                        '<input type="range" min="0" max="' + max + '" value="' + val + '" oninput="state.' + activeCat + '.' + f + '=this.value; renderUI();">';
                    area.appendChild(div);
                });
            } else {
                var div = document.createElement('div');
                div.className = 'grid-options';
                current.options.forEach(function(opt) {
                    var btn = document.createElement('button');
                    var isSel = (state.skin.preset === opt || state.hair.color === opt || state.anatomy.vagina === opt);
                    btn.className = 'opt-btn' + (isSel ? ' active' : '');
                    btn.innerText = opt;
                    btn.onclick = function() {
                        if(activeCat === 'skin') state.skin.preset = opt;
                        else if(activeCat === 'hair') state.hair.color = opt;
                        else if(activeCat === 'anatomy') state.anatomy.vagina = opt;
                        renderUI();
                    };
                    div.appendChild(btn);
                });
                area.appendChild(div);
            }
        }
        renderUI();

        window.onresize = function() {
            var w = container.clientWidth;
            var h = container.clientHeight;
            renderer.setSize(w, h);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        };
    </script>
</body>
</html>
