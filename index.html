<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUILD-A-BITCH.COM | Build 27.0 Master</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --primary: #a855f7;
            --bg: #050507;
            --panel: #0a0a0c;
            --border: #1a1a1c;
        }
        
        body, html {
            margin: 0; padding: 0;
            background: var(--bg);
            color: white;
            font-family: -apple-system, system-ui, sans-serif;
            height: 100%;
            width: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #main-container {
            display: flex;
            flex: 1;
            height: 100%;
            width: 100%;
        }

        #viewport {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #1a1a2e 0%, #050507 100%);
        }

        #sidebar {
            width: 350px;
            background: var(--panel);
            border-left: 1px solid var(--border);
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            z-index: 100;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }

        .header {
            position: absolute;
            top: 30px; left: 30px;
            pointer-events: none;
            z-index: 10;
        }

        .tag { font-size: 9px; font-weight: 900; color: var(--primary); letter-spacing: 0.5em; text-transform: uppercase; opacity: 0.8; margin-bottom: 4px; }
        .title { font-size: 24px; font-weight: 200; text-transform: uppercase; margin: 0; line-height: 1; letter-spacing: 0.1em; }
        .title b { font-weight: 800; color: var(--primary); }

        .tab-bar {
            display: flex; gap: 8px; margin-bottom: 30px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none;
        }

        .tab-bar::-webkit-scrollbar { display: none; }

        .tab-btn {
            padding: 12px 18px; background: #18181b; border: 1px solid #27272a; color: #71717a; border-radius: 12px; 
            cursor: pointer; font-size: 10px; font-weight: 800; text-transform: uppercase; transition: all 0.2s; flex-shrink: 0;
        }

        .tab-btn.active { background: #7c3aed; border-color: var(--primary); color: white; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3); }

        .slider-wrap {
            margin-bottom: 30px; background: #111113; padding: 15px; border-radius: 16px; border: 1px solid #18181b;
        }

        .label-row {
            display: flex; justify-content: space-between; font-size: 10px; font-weight: 900; margin-bottom: 12px; color: #a1a1aa; letter-spacing: 0.1em;
        }

        .label-row span:last-child { color: var(--primary); }

        input[type="range"] {
            width: 100%; height: 4px; background: #27272a; border-radius: 2px; appearance: none; outline: none; margin: 10px 0;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none; width: 20px; height: 20px; background: var(--primary); border-radius: 50%; cursor: pointer; border: 3px solid #fff; box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .grid-options {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }

        .opt-btn {
            padding: 16px; background: #18181b; border: 1px solid #27272a; color: #a1a1aa; font-size: 10px; 
            font-weight: 800; text-transform: uppercase; border-radius: 12px; cursor: pointer; transition: all 0.2s;
        }

        .opt-btn.active { background: #7c3aed; border-color: var(--primary); color: white; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3); }

        #init-loader {
            position: fixed; inset: 0; background: black; z-index: 1000; display: flex; align-items: center; justify-content: center; flex-direction: column;
        }

        @media (max-width: 768px) {
            #main-container { flex-direction: column; }
            #sidebar { width: 100%; height: 45%; border-left: none; border-top: 1px solid #18181b; box-sizing: border-box; }
            #viewport { height: 55%; }
        }
    </style>
</head>
<body>
    <div id="init-loader">
        <div style="color: #a855f7; font-weight: bold; margin-bottom: 10px; font-size: 12px;">BUILDING MASTERPIECE...</div>
        <div style="font-size: 9px; color: #444; letter-spacing: 0.2em;">CALIBRATING ANATOMICAL ENGINE v27.0</div>
    </div>

    <div id="main-container">
        <div id="viewport">
            <div class="header">
                <div class="tag">Anatomical Master Build 27.0</div>
                <div class="title">BUILD-A-<b>BITCH</b></div>
            </div>
        </div>

        <div id="sidebar">
            <div class="tab-bar" id="tabs"></div>
            <div id="controls-area"></div>
        </div>
    </div>

    <script>
        // --- DATA ---
        const state = {
            body: { height: 50, weight: 85, muscle: 50 },
            chest: { size: 10, type: 'Natural' },
            anatomy: { vagina: 'Type 2', bush: 'Natural' },
            hair: { color: 'red', style: 'Long' },
            skin: { preset: 'caucasian' }
        };

        const config = [
            { id: 'body', label: 'Body', fields: ['height', 'weight', 'muscle'] },
            { id: 'chest', label: 'Breasts', fields: ['size'], options: ['Type 1', 'Type 2', 'Type 3', 'Type 4'] },
            { id: 'anatomy', label: 'Anatomy', options: ['Vagina 1', 'Vagina 2', 'Vagina 3', 'Vagina 4', 'Vagina 5', 'Vagina 6', 'Shaved', 'Natural', 'Landing Strip'] },
            { id: 'hair', label: 'Hair', options: ['black', 'blonde', 'red', 'brown'] },
            { id: 'skin', label: 'Skin Tone', options: ['caucasian', 'african', 'east_asian', 'latin'] }
        ];

        const SKIN_PRESETS = { caucasian: "#f5d0c5", african: "#3d2b1f", east_asian: "#f3e0b5", latin: "#c68642" };
        const HAIR_COLORS = { black: "#090909", blonde: "#e6c073", red: "#9a3324", brown: "#4b3221" };

        let activeCat = 'body';

        // --- THREE.JS ENGINE ---
        const scene = new THREE.Scene();
        const container = document.getElementById('viewport');
        const camera = new THREE.PerspectiveCamera(30, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const spot = new THREE.SpotLight(0xffffff, 10);
        spot.position.set(5, 10, 7);
        scene.add(spot);

        // Realistic Materials
        const skinMat = new THREE.MeshPhysicalMaterial({ 
            roughness: 0.3, clearcoat: 0.1, sheen: 0.8, sheenColor: 0xffdbd1 
        });
        const innerSkinMat = new THREE.MeshStandardMaterial({ roughness: 0.3, color: 0xff7777 });
        const hairMat = new THREE.MeshStandardMaterial({ color: 0x9a3324, roughness: 0.8 });

        // Anatomy Logic
        const bodyGroup = new THREE.Group();
        
        // Ultra-Smooth Head
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 128, 128), skinMat);
        head.position.y = 1.55;

        // Ultra-Smooth Torso
        const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.35, 0.8, 128, 128), skinMat);
        torso.position.y = 0.6;

        // BREASTS (Anatomical Detail)
        const breastL = new THREE.Mesh(new THREE.SphereGeometry(0.12, 128, 128), skinMat);
        const breastR = new THREE.Mesh(new THREE.SphereGeometry(0.12, 128, 128), skinMat);
        
        const nippleL = new THREE.Mesh(new THREE.SphereGeometry(0.015, 32, 32), innerSkinMat);
        const nippleR = new THREE.Mesh(new THREE.SphereGeometry(0.015, 32, 32), innerSkinMat);

        // VAGINA (Anatomical Detail)
        const vaginaGroup = new THREE.Group();
        const labia = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 64), skinMat);
        labia.scale.set(0.06, 0.15, 0.04);
        const slit = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), innerSkinMat);
        slit.scale.set(0.01, 0.1, 0.02);
        slit.position.z = 0.035;
        vaginaGroup.add(labia, slit);
        vaginaGroup.position.set(0, 0.22, 0.33);
        vaginaGroup.rotation.x = -0.25;

        // HAIR (High Detail)
        const hairMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.28, 0.45, 16, 128), hairMat);
        hairMesh.position.set(0, 1.7, -0.05);

        // LEGS (Smooth Transition)
        const legL = new THREE.Mesh(new THREE.CapsuleGeometry(0.12, 0.75, 16, 64), skinMat);
        const legR = new THREE.Mesh(new THREE.CapsuleGeometry(0.12, 0.75, 16, 64), skinMat);

        bodyGroup.add(head, torso, breastL, breastR, nippleL, nippleR, vaginaGroup, hairMesh, legL, legR);
        scene.add(bodyGroup);
        bodyGroup.position.y = -0.3;
        camera.position.set(0, 1.3, 4.5);
        camera.lookAt(0, 0.8, 0);

        function animate() {
            requestAnimationFrame(animate);
            bodyGroup.rotation.y += 0.005;
            
            // Apply States
            const h = 0.85 + (state.body.height / 100) * 0.3;
            const w = 0.8 + (state.body.weight / 100) * 0.75; 
            bodyGroup.scale.set(h, h, h);
            torso.scale.set(w, 1, 0.95);
            
            const bSize = 0.12 + (state.chest.size / 15) * 0.2;
            breastL.geometry.dispose();
            breastL.geometry = new THREE.SphereGeometry(bSize, 128, 128);
            breastR.geometry.dispose();
            breastR.geometry = new THREE.SphereGeometry(bSize, 128, 128);
            
            const xPos = 0.16 * w;
            const zPos = 0.22 + (state.chest.size / 15) * 0.15;
            breastL.position.set(-xPos, 0.8, zPos);
            breastR.position.set(xPos, 0.8, zPos);
            nippleL.position.set(-xPos, 0.8, zPos + bSize - 0.005);
            nippleR.position.set(xPos, 0.8, zPos + bSize - 0.005);

            legL.position.x = -0.16 * w;
            legR.position.x = 0.16 * w;

            skinMat.color.set(SKIN_PRESETS[state.skin.preset]);
            hairMat.color.set(HAIR_COLORS[state.hair.color]);
            innerSkinMat.color.copy(skinMat.color).multiplyScalar(0.7).add(new THREE.Color(0.1, 0, 0));

            renderer.render(scene, camera);
        }
        animate();

        // --- UI ---
        function renderUI() {
            const tabs = document.getElementById('tabs');
            const area = document.getElementById('controls-area');
            tabs.innerHTML = ''; area.innerHTML = '';

            config.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (activeCat === c.id ? ' active' : '');
                btn.innerText = c.label;
                btn.onclick = () => { activeCat = c.id; renderUI(); };
                tabs.appendChild(btn);
            });

            const current = config.find(c => c.id === activeCat);
            if (current.fields) {
                current.fields.forEach(f => {
                    const div = document.createElement('div');
                    div.className = 'slider-wrap';
                    div.innerHTML = `<div class="label-row"><span>${f.toUpperCase()}</span><span>${state[activeCat][f]}%</span></div>
                                     <input type="range" min="0" max="100" value="${state[activeCat][f]}" oninput="state.${activeCat}.${f}=parseInt(this.value); renderUI();">`;
                    area.appendChild(div);
                });
            } else {
                const div = document.createElement('div');
                div.className = 'grid-options';
                current.options.forEach(opt => {
                    const btn = document.createElement('button');
                    const isSel = (state.skin.preset === opt || state.hair.color === opt || state.eyes.color === opt || state.anatomy.vagina === opt || state.anatomy.bush === opt || state.chest.type === opt);
                    btn.className = 'opt-btn' + (isSel ? ' active' : '');
                    btn.innerText = opt;
                    btn.onclick = () => {
                        if(activeCat === 'skin') state.skin.preset = opt;
                        else if(activeCat === 'hair') state.hair.color = opt;
                        else if(activeCat === 'eyes') state.eyes.color = opt;
                        else if(activeCat === 'anatomy') {
                           if(opt.includes('Vagina')) state.anatomy.vagina = opt;
                           else state.anatomy.bush = opt;
                        }
                        else if(activeCat === 'chest') state.chest.type = opt;
                        renderUI();
                    };
                    div.appendChild(btn);
                });
                area.appendChild(div);
            }
        }
        renderUI();
        document.getElementById('init-loader').remove();

        window.onresize = () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        };
    </script>
</body>
</html>
