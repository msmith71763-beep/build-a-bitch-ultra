<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUILD-A-BITCH | Step 1: Resizing</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #000; color: white; font-family: sans-serif; height: 100%; width: 100%; overflow: hidden; display: flex; flex-direction: column; touch-action: none; }
        #viewport { flex: 1; position: relative; background: #050507; }
        #sidebar { width: 320px; background: #0a0a0c; border-left: 1px solid #1a1a1c; padding: 25px; z-index: 100; }
        .header { position: absolute; top: 25px; left: 25px; pointer-events: none; z-index: 10; }
        .tag { font-size: 8px; font-weight: 900; color: #a855f7; letter-spacing: 0.5em; text-transform: uppercase; }
        .title { font-size: 24px; font-weight: 200; text-transform: uppercase; margin: 4px 0; }
        .group { margin-bottom: 35px; background: #111113; padding: 18px; border-radius: 16px; border: 1px solid #18181b; }
        .label { display: flex; justify-content: space-between; font-size: 11px; font-weight: 900; color: #eee; margin-bottom: 15px; }
        .label span:last-child { color: #a855f7; }
        input[type="range"] {
            width: 100%; height: 10px; background: #27272a; border-radius: 5px; appearance: none; outline: none; margin: 10px 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            appearance: none; width: 28px; height: 28px; background: #a855f7; border-radius: 50%; cursor: pointer; border: 3px solid #fff; box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        #status-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #a855f7; color: white; font-size: 9px; padding: 4px 10px; text-transform: uppercase; z-index: 1000; display: none; }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #viewport { height: 55%; }
            #sidebar { width: 100%; height: 45%; border-left: none; border-top: 1px solid #18181b; box-sizing: border-box; }
        }
    </style>
</head>
<body>
    <div id="status-bar">Establishing Connection...</div>

    <div id="viewport">
        <div class="header">
            <div class="tag">Step 1: Size & Proportions</div>
            <div class="title">BUILD-A-BITCH</div>
        </div>
    </div>

    <div id="sidebar">
        <h3 style="font-size:14px; font-weight:bold; margin-bottom:25px; color:#a855f7; border-left: 4px solid #a855f7; padding-left: 10px;">BODY SCALE</h3>
        
        <div class="group">
            <div class="label"><span>HEIGHT</span><span id="h-val">50%</span></div>
            <input type="range" id="height" min="0" max="100" value="50">
        </div>

        <div class="group">
            <div class="label"><span>WEIGHT / HIPS</span><span id="w-val">50%</span></div>
            <input type="range" id="weight" min="0" max="100" value="50">
        </div>

        <p style="font-size:10px; color:#555; line-height: 1.4;">I have made the girl bigger and the sliders thicker for your phone. Test the Height and Hips now.</p>
    </div>

    <script>
        const scene = new THREE.Scene();
        const container = document.getElementById('viewport');
        
        // MOVE CAMERA CLOSER (From 4.5 to 3.2)
        const camera = new THREE.PerspectiveCamera(30, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(0, 0.6, 3.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enablePan = false; controls.target.set(0, 0.7, 0); 

        scene.add(new THREE.AmbientLight(0xffffff, 1.4));
        const light = new THREE.DirectionalLight(0xffffff, 1.0); light.position.set(5, 10, 7); scene.add(light);

        const skinMat = new THREE.MeshStandardMaterial({ color: 0xf5d0c5, roughness: 0.4 });

        let model;
        const loader = new THREE.GLTFLoader();
        loader.load('https://raw.githubusercontent.com/PacktPublishing/Hands-On-Game-Animation-Programming/master/AllChapters/Assets/Woman.gltf', (gltf) => {
            model = gltf.scene;
            model.traverse(child => {
                if (child.isMesh) {
                    const name = child.name.toLowerCase();
                    if (name.includes('glasses') || name.includes('outfit') || name.includes('shoe') || name.includes('top') || name.includes('bottom')) {
                        child.visible = false;
                    } else {
                        child.material = skinMat;
                        child.visible = true;
                    }
                }
            });
            model.position.y = -1.1;
            scene.add(model);
            animate();
        });

        const hInput = document.getElementById('height');
        const wInput = document.getElementById('weight');

        function animate() {
            requestAnimationFrame(animate);
            if (model) {
                // EXAGGERATED RESIZING MATH
                const hScale = 0.8 + (hInput.value / 100) * 0.6; // Changes height from 80% to 140%
                const wScale = 0.8 + (wInput.value / 100) * 0.8; // Changes width/hips from 80% to 160%
                
                model.scale.set(wScale, hScale, wScale);
                
                document.getElementById('h-val').innerText = hInput.value + '%';
                document.getElementById('w-val').innerText = wInput.value + '%';
            }
            controls.update();
            renderer.render(scene, camera);
        }

        window.onresize = () => {
            camera.aspect = container.clientWidth / container.clientHeight; camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        };
    </script>
</body>
</html>
