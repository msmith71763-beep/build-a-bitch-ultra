<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUILD-A-BITCH | Step 1: Proportions</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #000; color: white; font-family: sans-serif; height: 100%; width: 100%; overflow: hidden; display: flex; flex-direction: column; touch-action: none; }
        #viewport { flex: 1; position: relative; background: #050507; }
        #sidebar { width: 320px; background: #0a0a0c; border-left: 1px solid #1a1a1c; padding: 25px; z-index: 100; }
        .header { position: absolute; top: 25px; left: 25px; pointer-events: none; z-index: 10; }
        .tag { font-size: 9px; font-weight: 900; color: #a855f7; letter-spacing: 0.5em; text-transform: uppercase; }
        .title { font-size: 24px; font-weight: 200; text-transform: uppercase; margin: 4px 0; }
        .group { margin-bottom: 30px; background: #111113; padding: 15px; border-radius: 16px; border: 1px solid #18181b; }
        .label { display: flex; justify-content: space-between; font-size: 10px; font-weight: 900; margin-bottom: 12px; color: #aaa; }
        input[type="range"] { width: 100%; height: 4px; background: #27272a; border-radius: 2px; appearance: none; outline: none; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 20px; height: 20px; background: #a855f7; border-radius: 50%; border: 3px solid #fff; }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #viewport { height: 60%; }
            #sidebar { width: 100%; height: 40%; border-left: none; border-top: 1px solid #18181b; box-sizing: border-box; }
        }
    </style>
</head>
<body>
    <div id="viewport">
        <div class="header">
            <div class="tag">Step 1: Base Body Calibration</div>
            <div class="title">BUILD-A-BITCH</div>
        </div>
    </div>

    <div id="sidebar">
        <h3 style="font-size:14px; font-weight:bold; margin-bottom:20px; color:#a855f7;">BODY PROPORTIONS</h3>
        <div class="group">
            <div class="label"><span>HEIGHT</span><span id="h-val">50%</span></div>
            <input type="range" id="height" min="0" max="100" value="50">
        </div>
        <div class="group">
            <div class="label"><span>WEIGHT / HIPS</span><span id="w-val">50%</span></div>
            <input type="range" id="weight" min="0" max="100" value="50">
        </div>
        <p style="font-size:10px; color:#444;">Verify 360 rotation and hips before we move to the next step.</p>
    </div>

    <script>
        const scene = new THREE.Scene();
        const container = document.getElementById('viewport');
        const camera = new THREE.PerspectiveCamera(30, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(0, 0.5, 4.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enablePan = false; controls.target.set(0, -0.2, 0); controls.update();

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const sun = new THREE.DirectionalLight(0xffffff, 1.0); sun.position.set(5, 10, 7); scene.add(sun);

        const skinMat = new THREE.MeshStandardMaterial({ color: 0xf5d0c5, roughness: 0.4 });

        let model;
        const loader = new THREE.GLTFLoader();
        loader.load('https://raw.githubusercontent.com/hmthanh/3d-human-model/main/TranThiNgocTham.glb', (gltf) => {
            model = gltf.scene;
            model.traverse(child => {
                if (child.isMesh) {
                    const name = child.name.toLowerCase();
                    // Hide EVERYTHING except the base body mesh
                    if (name.includes('outfit') || name.includes('glasses') || name.includes('hair') || name.includes('footwear')) {
                        child.visible = false;
                    } else {
                        child.material = skinMat;
                        child.visible = true;
                    }
                }
            });
            model.position.y = -1.2;
            scene.add(model);
            animate();
        });

        const hInput = document.getElementById('height');
        const wInput = document.getElementById('weight');

        function animate() {
            requestAnimationFrame(animate);
            if (model) {
                const h = 0.9 + (hInput.value / 100) * 0.2;
                const w = 0.85 + (wInput.value / 100) * 0.7; 
                model.scale.set(w, h, w);
                document.getElementById('h-val').innerText = hInput.value + '%';
                document.getElementById('w-val').innerText = wInput.value + '%';
            }
            renderer.render(scene, camera);
        }

        window.onresize = () => {
            camera.aspect = container.clientWidth / container.clientHeight; camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        };
    </script>
</body>
</html>
