<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUILD-A-BITCH.COM | Elite Build 31.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root { --primary: #a855f7; --bg: #050507; --panel: #0a0a0c; --border: #1a1a1c; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: white; font-family: sans-serif; height: 100%; width: 100%; overflow: hidden; display: flex; flex-direction: column; }
        #main-container { display: flex; flex: 1; height: 100%; width: 100%; }
        #viewport { flex: 1; position: relative; background: radial-gradient(circle at center, #1a1a2e 0%, #050507 100%); }
        #sidebar { width: 350px; background: var(--panel); border-left: 1px solid var(--border); padding: 25px; overflow-y: auto; z-index: 100; }
        .header { position: absolute; top: 30px; left: 30px; pointer-events: none; z-index: 10; }
        .tag { font-size: 9px; font-weight: 900; color: var(--primary); letter-spacing: 0.5em; text-transform: uppercase; opacity: 0.8; margin-bottom: 4px; }
        .title { font-size: 24px; font-weight: 200; text-transform: uppercase; margin: 0; line-height: 1; letter-spacing: 0.1em; }
        .title b { font-weight: 800; color: var(--primary); }
        .tab-bar { display: flex; gap: 8px; margin-bottom: 30px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
        .tab-btn { padding: 12px 18px; background: #18181b; border: 1px solid #27272a; color: #71717a; border-radius: 12px; cursor: pointer; font-size: 10px; font-weight: 800; text-transform: uppercase; transition: all 0.2s; flex-shrink: 0; }
        .tab-btn.active { background: #7c3aed; border-color: var(--primary); color: white; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3); }
        .slider-wrap { margin-bottom: 30px; background: #111113; padding: 15px; border-radius: 16px; border: 1px solid #18181b; }
        .label-row { display: flex; justify-content: space-between; font-size: 10px; font-weight: 900; margin-bottom: 12px; color: #a1a1aa; letter-spacing: 0.1em; }
        .label-row span:last-child { color: var(--primary); }
        input[type="range"] { width: 100%; height: 4px; background: #27272a; border-radius: 2px; appearance: none; outline: none; margin: 10px 0; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 20px; height: 20px; background: var(--primary); border-radius: 50%; cursor: pointer; border: 3px solid #fff; }
        .grid-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .opt-btn { padding: 16px; background: #18181b; border: 1px solid #27272a; color: #a1a1aa; font-size: 10px; font-weight: 800; text-transform: uppercase; border-radius: 12px; cursor: pointer; }
        .opt-btn.active { background: #7c3aed; color: white; }
        @media (max-width: 768px) {
            #main-container { flex-direction: column; }
            #sidebar { width: 100%; height: 45%; border-left: none; border-top: 1px solid #18181b; box-sizing: border-box; }
            #viewport { height: 55%; }
        }
    </style>
</head>
<body>
    <div id="main-container">
        <div id="viewport">
            <div class="header">
                <div class="tag">Master Build 31.0 - Full Realism</div>
                <div class="title">BUILD-A-<b>BITCH</b></div>
            </div>
        </div>
        <div id="sidebar">
            <div class="tab-bar" id="tabs"></div>
            <div id="controls-area"></div>
        </div>
    </div>

    <script>
        const state = {
            body: { height: 50, weight: 85, muscle: 50 },
            chest: { size: 10, type: 'Natural' },
            anatomy: { vagina: 'Type 2', bush: 'Natural' },
            hair: { color: 'red' },
            eyes: { color: 'green' },
            skin: { preset: 'caucasian' },
            animation: { pose: 'idle' }
        };

        const config = [
            { id: 'body', label: 'Proportions', fields: ['height', 'weight'] },
            { id: 'chest', label: 'Breasts', fields: ['size'], options: ['Natural', 'Perky', 'Firm'] },
            { id: 'anatomy', label: 'Anatomy', options: ['Vagina 1', 'Vagina 2', 'Vagina 3', 'Shaved', 'Natural', 'Bush'] },
            { id: 'hair', label: 'Hair', options: ['black', 'blonde', 'red', 'brown'] },
            { id: 'animation', label: 'Pose', options: ['idle', 'hands_on_hips', 'catwalk'] },
            { id: 'skin', label: 'Skin Tone', options: ['caucasian', 'african', 'east_asian', 'latin'] }
        ];

        const SKIN_PRESETS = { caucasian: "#f5d0c5", african: "#3d2b1f", east_asian: "#f3e0b5", latin: "#c68642" };
        const HAIR_COLORS = { black: "#090909", blonde: "#e6c073", red: "#9a3324", brown: "#4b3221" };

        let activeCat = 'body';

        // --- THREE.JS ---
        const scene = new THREE.Scene();
        const container = document.getElementById('viewport');
        const camera = new THREE.PerspectiveCamera(28, container.clientWidth / container.clientHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enablePan = false; controls.target.set(0, 0.9, 0); controls.update();

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const spot = new THREE.SpotLight(0xffffff, 8); spot.position.set(5, 10, 7); scene.add(spot);

        // Smooth Physical Material
        const skinMat = new THREE.MeshPhysicalMaterial({ roughness: 0.3, clearcoat: 0.2, sheen: 0.8, sheenColor: 0xffdbd1 });
        const hairMat = new THREE.MeshStandardMaterial({ roughness: 0.8 });
        const innerSkinMat = new THREE.MeshStandardMaterial({ color: 0xff7777 });

        const bodyGroup = new THREE.Group();
        
        // Components (Higher segments = No Bubbles)
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 64, 64), skinMat); head.position.y = 1.55;
        const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.35, 0.8, 16, 64), skinMat); torso.position.y = 0.6;
        const breastL = new THREE.Mesh(new THREE.SphereGeometry(0.12, 64, 64), skinMat);
        const breastR = new THREE.Mesh(new THREE.SphereGeometry(0.12, 64, 64), skinMat);
        
        const vagina = new THREE.Group();
        const labia = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), skinMat); labia.scale.set(0.06, 0.15, 0.04);
        const slit = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 16), innerSkinMat); slit.scale.set(0.01, 0.1, 0.02); slit.position.z = 0.035;
        vagina.add(labia, slit); vagina.position.set(0, 0.22, 0.33); vagina.rotation.x = -0.25;

        const bush = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 0.15), hairMat); 
        bush.position.set(0, 0.28, 0.35); bush.rotation.x = -0.15; bush.visible = true;

        const legL = new THREE.Mesh(new THREE.CapsuleGeometry(0.12, 0.75, 8, 32), skinMat);
        const legR = new THREE.Mesh(new THREE.CapsuleGeometry(0.12, 0.75, 8, 32), skinMat);
        const hairMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.28, 0.45, 8, 64), hairMat); hairMesh.position.set(0, 1.7, -0.05);

        bodyGroup.add(head, torso, breastL, breastR, vagina, bush, legL, legR, hairMesh);
        scene.add(bodyGroup); bodyGroup.position.y = -0.3;
        camera.position.set(0, 1.3, 4.5);

        function animate() {
            requestAnimationFrame(animate);
            if (state.animation.pose === 'idle') bodyGroup.rotation.y += 0.005;
            
            const h = 0.85 + (state.body.height / 100) * 0.3;
            const w = 0.8 + (state.body.weight / 100) * 0.75; 
            bodyGroup.scale.set(h, h, h);
            torso.scale.set(w, 1, 0.95);
            
            const bSize = 0.12 + (state.chest.size / 15) * 0.22;
            breastL.scale.setScalar(bSize/0.12); breastR.scale.setScalar(bSize/0.12);
            const xPos = 0.16 * w; const zPos = 0.22 + (state.chest.size / 15) * 0.15;
            breastL.position.set(-xPos, 0.8, zPos); breastR.position.set(xPos, 0.8, zPos);

            legL.position.x = -0.16 * w; legR.position.x = 0.16 * w;
            skinMat.color.set(SKIN_PRESETS[state.skin.preset]);
            hairMat.color.set(HAIR_COLORS[state.hair.color]);
            bush.visible = state.anatomy.bush !== 'Shaved';

            renderer.render(scene, camera);
        }
        animate();

        function renderUI() {
            const tabs = document.getElementById('tabs'); const area = document.getElementById('controls-area');
            tabs.innerHTML = ''; area.innerHTML = '';

            config.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (activeCat === c.id ? ' active' : '');
                btn.innerText = c.label; btn.onclick = () => { activeCat = c.id; renderUI(); };
                tabs.appendChild(btn);
            });

            const current = config.find(c => c.id === activeCat);
            if (current.fields) {
                current.fields.forEach(f => {
                    const div = document.createElement('div'); div.className = 'slider-wrap';
                    div.innerHTML = `<div class="label-row"><span>${f.toUpperCase()}</span><span>${state[activeCat][f]}%</span></div>
                                     <input type="range" min="0" max="100" value="${state[activeCat][f]}" oninput="state.${activeCat}.${f}=this.value; this.parentElement.querySelector('.label-row span:last-child').innerText = this.value + '%';">`;
                    area.appendChild(div);
                });
            } else {
                const div = document.createElement('div'); div.className = 'grid-options';
                current.options.forEach(opt => {
                    const btn = document.createElement('button');
                    const isSel = (state.skin.preset === opt || state.hair.color === opt || state.animation.pose === opt || state.anatomy.vagina === opt || state.anatomy.bush === opt);
                    btn.className = 'opt-btn' + (isSel ? ' active' : '');
                    btn.innerText = opt; btn.onclick = () => {
                        if(activeCat === 'skin') state.skin.preset = opt;
                        else if(activeCat === 'hair') state.hair.color = opt;
                        else if(activeCat === 'animation') state.animation.pose = opt;
                        else if(activeCat === 'anatomy') { if(opt.includes('Vagina')) state.anatomy.vagina = opt; else state.anatomy.bush = opt; }
                        renderUI();
                    };
                    div.appendChild(btn);
                });
                area.appendChild(div);
            }
        }
        renderUI();

        window.onresize = () => {
            camera.aspect = container.clientWidth / container.clientHeight; camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        };
    </script>
</body>
</html>
