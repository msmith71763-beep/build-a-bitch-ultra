<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUILD-A-BITCH.COM | Realism Build 49.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #000; color: white; font-family: sans-serif; height: 100%; width: 100%; overflow: hidden; display: flex; flex-direction: column; touch-action: none; }
        #viewport { flex: 1; position: relative; background: #050507; }
        #sidebar { width: 320px; background: #09090b; border-left: 1px solid #1a1a1c; padding: 25px; overflow-y: auto; z-index: 100; }
        .header { position: absolute; top: 25px; left: 25px; pointer-events: none; z-index: 10; }
        .tag { font-size: 8px; font-weight: 900; color: #a855f7; letter-spacing: 0.5em; text-transform: uppercase; }
        .title { font-size: 22px; font-weight: 200; text-transform: uppercase; margin: 4px 0; }
        .title b { color: #a855f7; font-weight: 800; }
        .tab-bar { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 10px; }
        .tab-btn { padding: 10px 14px; background: #161618; border: 1px solid #222; color: #666; border-radius: 10px; cursor: pointer; font-size: 9px; font-weight: 800; text-transform: uppercase; flex-shrink: 0; }
        .tab-btn.active { background: #7c3aed; color: white; }
        .group { margin-bottom: 25px; background: #0d0d0f; padding: 15px; border-radius: 16px; border: 1px solid #161618; }
        .label { display: flex; justify-content: space-between; font-size: 9px; font-weight: 900; margin-bottom: 10px; color: #aaa; }
        .label span:last-child { color: #a855f7; }
        input[type="range"] { width: 100%; height: 4px; background: #222; border-radius: 2px; appearance: none; outline: none; margin: 10px 0; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 22px; height: 22px; background: #a855f7; border-radius: 50%; cursor: pointer; border: 3px solid #fff; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .opt-btn { padding: 12px; background: #161618; border: 1px solid #222; color: #888; font-size: 9px; font-weight: 800; text-transform: uppercase; border-radius: 10px; cursor: pointer; }
        .opt-btn.active { background: #7c3aed; color: white; }
        #load-screen { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .loader { width: 30px; height: 30px; border: 3px solid #7c3aed33; border-top-color: #7c3aed; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #viewport { height: 60%; }
            #sidebar { width: 100%; height: 40%; border-left: none; border-top: 1px solid #1a1a1c; box-sizing: border-box; }
        }
    </style>
</head>
<body>
    <div id="load-screen">
        <div class="loader"></div>
        <div style="color:#a855f7; font-weight:bold; font-size:12px; letter-spacing: 0.1em;">SCULPTING REALISM...</div>
        <div id="status" style="font-size:9px; color:#444; margin-top:5px;">0%</div>
    </div>

    <div id="viewport">
        <div class="header">
            <div class="tag">Step 2: Sculpted Realism Build</div>
            <div class="title">BUILD-A-<b>BITCH</b></div>
        </div>
    </div>

    <div id="sidebar">
        <div class="tab-bar" id="tabs"></div>
        <div id="controls-area"></div>
    </div>

    <script>
        const state = {
            body: { height: 50, weight: 80 },
            chest: { size: 10, nipples: 'Natural' },
            anatomy: { vagina: 'Type 2', bush: 'Natural' },
            hair: { color: 'red' },
            skin: { preset: 'caucasian' }
        };

        const config = [
            { id: 'body', label: 'Body', fields: ['height', 'weight'] },
            { id: 'chest', label: 'Breasts', fields: ['size'], options: ['Natural', 'Perky', 'Firm'] },
            { id: 'anatomy', label: 'Anatomy', options: ['Vagina 1', 'Vagina 2', 'Vagina 3', 'Shaved', 'Natural', 'Bush'] },
            { id: 'hair', label: 'Hair', options: ['black', 'blonde', 'red', 'brown'] },
            { id: 'skin', label: 'Skin Tone', options: ['caucasian', 'african', 'east_asian', 'latin'] }
        ];

        const PRESETS = {
            skin: { caucasian: "#f5d0c5", african: "#3d2b1f", east_asian: "#f3e0b5", latin: "#c68642" },
            hair: { black: "#090909", blonde: "#e6c073", red: "#9a3324", brown: "#4b3221" }
        };

        let activeCat = 'body'; let model; let controls;

        const scene = new THREE.Scene();
        const viewport = document.getElementById('viewport');
        const camera = new THREE.PerspectiveCamera(28, viewport.clientWidth / viewport.clientHeight, 0.1, 100);
        camera.position.set(0, 0.8, 4.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(viewport.clientWidth, viewport.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        viewport.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enablePan = false; controls.target.set(0, 0.9, 0); controls.update();

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const light = new THREE.DirectionalLight(0xffffff, 1.2); light.position.set(5, 10, 7); scene.add(light);

        const skinMat = new THREE.MeshPhysicalMaterial({ roughness: 0.35, clearcoat: 0.1, sheen: 0.5, sheenColor: 0xffdbd1 });
        const hairMat = new THREE.MeshStandardMaterial({ roughness: 0.8 });
        const pinkMat = new THREE.MeshStandardMaterial({ color: 0xff7777, roughness: 0.3 });

        // ANATOMY OVERLAYS
        const breastGroup = new THREE.Group();
        const breastL = new THREE.Mesh(new THREE.SphereGeometry(0.12, 128, 128), skinMat);
        const breastR = new THREE.Mesh(new THREE.SphereGeometry(0.12, 128, 128), skinMat);
        const nipL = new THREE.Mesh(new THREE.SphereGeometry(0.015, 32, 32), pinkMat);
        const nipR = new THREE.Mesh(new THREE.SphereGeometry(0.015, 32, 32), pinkMat);
        breastGroup.add(breastL, breastR, nipL, nipR);
        breastGroup.position.y = 0.85;

        const vaginaGroup = new THREE.Group();
        const labia = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 64), skinMat);
        labia.scale.set(0.08, 0.18, 0.05);
        const slit = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), pinkMat);
        slit.scale.set(0.01, 0.12, 0.02); slit.position.z = 0.04;
        vaginaGroup.add(labia, slit);
        vaginaGroup.position.set(0, -0.4, 0.35); vaginaGroup.rotation.x = -0.25;

        const loader = new THREE.GLTFLoader();
        // Using the SCULPTED 2.8MB REAL PERSON model
        loader.load('https://raw.githubusercontent.com/PacktPublishing/Hands-On-Game-Animation-Programming/master/AllChapters/Assets/Woman.gltf', (gltf) => {
            model = gltf.scene;
            model.traverse(child => {
                if (child.isMesh) {
                    const name = child.name.toLowerCase();
                    if (name.includes('glasses') || name.includes('outfit') || name.includes('top') || name.includes('bottom') || name.includes('footwear')) {
                        child.visible = false;
                    } else {
                        child.material = name.includes('hair') ? hairMat : skinMat;
                        child.visible = true;
                        if(child.geometry) child.geometry.computeVertexNormals();
                    }
                }
            });
            model.position.y = -1.2; scene.add(model);
            model.add(breastGroup); 
            model.add(vaginaGroup);
            
            document.getElementById('load-screen').remove();
            animate();
        }, (xhr) => {
            document.getElementById('status').innerText = Math.round((xhr.loaded / xhr.total) * 100) + '%';
        });

        function animate() {
            requestAnimationFrame(animate);
            if (model) {
                model.rotation.y += 0.005;
                const h = 0.9 + (state.body.height / 100) * 0.3;
                const w = 0.85 + (state.body.weight / 100) * 0.75; 
                model.scale.set(w, h, w);

                // Scale Breasts independently
                const bSize = 0.6 + (state.chest.size / 15) * 1.4;
                breastL.scale.setScalar(bSize); breastR.scale.setScalar(bSize);
                
                const xPos = 0.16; const zPos = 0.23 + (state.chest.size/15)*0.15;
                breastL.position.set(-xPos, 0, zPos); breastR.position.set(xPos, 0, zPos);
                nipL.position.set(-xPos, 0, zPos + (bSize*0.12) - 0.01); 
                nipR.position.set(xPos, 0, zPos + (bSize*0.12) - 0.01);
            }
            skinMat.color.set(PRESETS.skin[state.skin.preset]);
            hairMat.color.set(PRESETS.hair[state.hair.color]);
            controls.update();
            renderer.render(scene, camera);
        }

        function renderUI() {
            const tabs = document.getElementById('tabs'); const area = document.getElementById('controls-area');
            tabs.innerHTML = ''; area.innerHTML = '';

            config.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (activeCat === c.id ? ' active' : '');
                btn.innerText = c.label; btn.onclick = () => { activeCat = c.id; renderUI(); };
                tabs.appendChild(btn);
            });

            const current = config.find(c => c.id === activeCat);
            if (current.fields) {
                current.fields.forEach(f => {
                    const div = document.createElement('div'); div.className = 'group';
                    div.innerHTML = `<div class="label"><span>${f.toUpperCase()}</span><span>${state[activeCat][f]}%</span></div>
                                     <input type="range" min="0" max="100" value="${state[activeCat][f]}" oninput="state.${activeCat}.${f}=this.value; renderUI();">`;
                    area.appendChild(div);
                });
            } else {
                const div = document.createElement('div'); div.className = 'grid-options';
                current.options.forEach(opt => {
                    const btn = document.createElement('button');
                    const isSel = (state.skin.preset === opt || state.hair.color === opt || state.eyes.color === opt || state.anatomy.vagina === opt);
                    btn.className = 'opt-btn' + (isSel ? ' active' : '');
                    btn.innerText = opt; btn.onclick = () => {
                        if(activeCat === 'skin') state.skin.preset = opt;
                        else if(activeCat === 'hair') state.hair.color = opt;
                        else if(activeCat === 'eyes') state.eyes.color = opt;
                        else if(activeCat === 'anatomy') state.anatomy.vagina = opt;
                        renderUI();
                    };
                    div.appendChild(btn);
                });
                area.appendChild(div);
            }
        }
        renderUI();

        window.onresize = () => {
            camera.aspect = viewport.clientWidth / viewport.clientHeight; camera.updateProjectionMatrix();
            renderer.setSize(viewport.clientWidth, viewport.clientHeight);
        };
    </script>
</body>
</html>
