<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUILD-A-BITCH | Step 1: Stability</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #000; color: white; font-family: sans-serif; height: 100%; width: 100%; overflow: hidden; display: flex; flex-direction: column; touch-action: none; }
        #viewport { flex: 1; position: relative; background: #050507; }
        #sidebar { width: 320px; background: #0a0a0c; border-left: 1px solid #1a1a1c; padding: 25px; z-index: 100; }
        .header { position: absolute; top: 25px; left: 25px; pointer-events: none; z-index: 10; }
        .tag { font-size: 8px; font-weight: 900; color: #a855f7; letter-spacing: 0.5em; text-transform: uppercase; }
        .title { font-size: 24px; font-weight: 200; text-transform: uppercase; margin: 4px 0; }
        .group { margin-bottom: 30px; background: #111113; padding: 15px; border-radius: 16px; border: 1px solid #18181b; }
        .label { display: flex; justify-content: space-between; font-size: 10px; font-weight: 900; color: #aaa; }
        input[type="range"] { width: 100%; height: 4px; background: #27272a; border-radius: 2px; appearance: none; outline: none; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 20px; height: 20px; background: #a855f7; border-radius: 50%; cursor: pointer; border: 3px solid #fff; }
        #load-info { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .spinner { width: 30px; height: 30px; border: 3px solid #7c3aed33; border-top-color: #7c3aed; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #viewport { height: 60%; }
            #sidebar { width: 100%; height: 40%; border-left: none; border-top: 1px solid #18181b; box-sizing: border-box; }
        }
    </style>
</head>
<body>
    <div id="load-info">
        <div class="spinner"></div>
        <div style="color:#a855f7; font-weight:bold; font-size:12px;">BOOTING SYSTEM...</div>
        <div id="perc" style="font-size:10px; color:#444; margin-top:5px;">PLEASE WAIT</div>
    </div>

    <div id="viewport">
        <div class="header">
            <div class="tag">Step 1: Elite Realism Stability</div>
            <div class="title">BUILD-A-BITCH</div>
        </div>
    </div>

    <div id="sidebar">
        <h3 style="font-size:14px; font-weight:bold; margin-bottom:20px; color:#a855f7;">BODY PROPORTIONS</h3>
        <div class="group">
            <div class="label"><span>WEIGHT / HIPS</span><span id="w-val">50%</span></div>
            <input type="range" id="weight" min="0" max="100" value="50">
        </div>
        <p style="font-size:10px; color:#444;">Test the 360 swipe. If the screen is still black, wait 10 seconds for the model to download.</p>
    </div>

    <script>
        const scene = new THREE.Scene();
        const container = document.getElementById('viewport');
        const camera = new THREE.PerspectiveCamera(30, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(0, 0.8, 4.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enablePan = false; controls.target.set(0, 0.9, 0); 

        scene.add(new THREE.AmbientLight(0xffffff, 1.5));
        const light = new THREE.DirectionalLight(0xffffff, 1.2); light.position.set(5, 10, 7); scene.add(light);

        let model;
        const loader = new THREE.GLTFLoader();
        // Using a high-fidelity official Three.js example model for maximum stability
        loader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/Michelle.glb', (gltf) => {
            model = gltf.scene;
            model.traverse(child => {
                if (child.isMesh) {
                    child.visible = true;
                    child.frustumCulled = false;
                    // Ensure we can see her skin
                    const name = child.name.toLowerCase();
                    if (name.includes('glasses') || name.includes('outfit')) child.visible = false;
                }
            });
            model.position.y = -1.2;
            scene.add(model);
            document.getElementById('load-info').remove();
            animate();
        }, (xhr) => {
             if (xhr.total > 0) {
                document.getElementById('perc').innerText = Math.round((xhr.loaded / xhr.total) * 100) + '%';
             }
        });

        const wInput = document.getElementById('weight');

        function animate() {
            requestAnimationFrame(animate);
            if (model) {
                const w = 0.85 + (wInput.value / 100) * 0.7; 
                model.scale.set(w, 1, w);
                document.getElementById('w-val').innerText = wInput.value + '%';
            }
            controls.update();
            renderer.render(scene, camera);
        }

        window.onresize = () => {
            camera.aspect = container.clientWidth / container.clientHeight; camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        };
    </script>
</body>
</html>
