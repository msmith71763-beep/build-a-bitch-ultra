<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUILD-A-BITCH.COM | Build 57.5</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        :root { --primary: #7c3aed; --bg: #444444; --panel: #333333; --border: #555; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: white; font-family: sans-serif; height: 100%; width: 100%; overflow: hidden; display: flex; flex-direction: column; touch-action: none; }
        #main-container { display: flex; flex: 1; height: 100%; width: 100%; background: var(--bg); flex-direction: row; }
        #viewport { flex: 1; position: relative; background: var(--bg); overflow: hidden; }
        #sidebar { width: 350px; background: var(--panel); border-left: 20px solid var(--border); padding: 25px; overflow-y: auto; z-index: 100; box-shadow: -5px 0 20px rgba(0,0,0,0.3); box-sizing: border-box; }
        .header { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 10; }
        .tag { font-size: 10px; font-weight: 900; color: #fff; background: var(--primary); padding: 4px 10px; border-radius: 6px; letter-spacing: 0.1em; text-transform: uppercase; display: inline-block; }
        .title { font-size: 24px; font-weight: 800; text-transform: uppercase; margin: 10px 0; color: #eee; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .tab-bar { display: flex; gap: 8px; margin-bottom: 25px; overflow-x: auto; padding-bottom: 12px; }
        .tab-btn { padding: 12px 16px; background: #444; border: 1px solid #555; color: #ccc; border-radius: 12px; cursor: pointer; font-size: 10px; font-weight: 800; text-transform: uppercase; flex-shrink: 0; }
        .tab-btn.active { background: var(--primary); border-color: var(--primary); color: white; }
        .control-group { margin-bottom: 20px; background: #3d3d3d; padding: 18px; border-radius: 16px; border: 1px solid #555; }
        .label { display: flex; justify-content: space-between; font-size: 10px; font-weight: 900; margin-bottom: 12px; color: #bbb; letter-spacing: 0.1em; }
        .label span:last-child { color: #fff; background: var(--primary); padding: 0 6px; border-radius: 4px; }
        input[type="range"] { width: 100%; height: 6px; background: #555; border-radius: 3px; appearance: none; outline: none; margin: 10px 0; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 28px; height: 28px; background: var(--primary); border-radius: 50%; cursor: pointer; border: 3px solid #fff; }
        .grid-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .opt-btn { padding: 16px; background: #444; border: 1px solid #555; color: #ccc; font-size: 10px; font-weight: 800; text-transform: uppercase; border-radius: 12px; cursor: pointer; }
        .opt-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #7c3aed; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; z-index: 1000; font-size: 14px; text-align: center; background: rgba(0,0,0,0.9); padding: 30px; border-radius: 24px; min-width: 280px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        #loading .bar-wrap { width: 200px; height: 8px; background: #222; border-radius: 4px; margin: 15px auto; overflow: hidden; border: 1px solid #444; }
        #loading .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #7c3aed, #a78bfa); border-radius: 4px; transition: width 0.3s; }
        #status-log { font-size: 10px; color: #888; margin-top: 15px; font-family: monospace; text-align: left; max-height: 60px; overflow-y: auto; }
        .error-msg { color: #ef4444 !important; font-weight: 700; }
        @media (max-width: 768px) {
            #main-container { flex-direction: column; }
            #sidebar { width: 100%; height: 45%; border-left: none; border-top: 2px solid var(--border); }
            #viewport { height: 55%; flex: none; }
        }
    </style>
</head>
<body>
    <div id="main-container">
        <div id="viewport">
            <div id="loading">
                <div id="loading-text">STREAMING MESH...</div>
                <div class="bar-wrap"><div class="bar-fill" id="loading-bar"></div></div>
                <div id="status-log">Initializing...</div>
                <button id="retry-btn" onclick="location.reload(true)" style="display:none; margin-top:15px; background:#7c3aed; color:white; border:none; padding:10px 20px; border-radius:10px; font-weight:800; cursor:pointer;">RETRY LOAD</button>
            </div>
            <div class="header">
                <div class="tag">Build 57.5 - Ultra Robust</div>
                <div class="title">BUILD-A-BITCH.COM</div>
            </div>
        </div>
        <div id="sidebar">
            <div class="tab-bar" id="tabs"></div>
            <div id="controls-area"></div>
        </div>
    </div>

    <script>
        const log = (msg, isError = false) => {
            const el = document.getElementById('status-log');
            if (!el) return;
            const line = document.createElement('div');
            if (isError) line.className = 'error-msg';
            line.innerText = `> ${msg}`;
            el.appendChild(line);
            el.scrollTop = el.scrollHeight;
        };

        const state = {
            body: { height: 50, weight: 85, hips: 70 },
            chest: { size: 10 },
            anatomy: { vagina: 'Type 2' },
            hair: { color: 'red' },
            skin: { preset: 'caucasian' }
        };

        const config = [
            { id: 'body', label: 'Body', fields: ['height', 'weight', 'hips'] },
            { id: 'chest', label: 'Breasts', fields: ['size'] },
            { id: 'anatomy', label: 'Anatomy', options: ['Type 1', 'Type 2', 'Type 3', 'Type 4', 'Type 5', 'Type 6'] },
            { id: 'hair', label: 'Hair', options: ['black', 'blonde', 'red', 'brown'] },
            { id: 'skin', label: 'Skin', options: ['caucasian', 'african', 'east_asian', 'latin'] }
        ];

        const SKIN_PRESETS = { caucasian: "#f5d0c5", african: "#3d2b1f", east_asian: "#f3e0b5", latin: "#c68642" };
        const HAIR_COLORS = { black: "#090909", blonde: "#e6c073", red: "#9a3324", brown: "#4b3221" };

        let activeCat = 'body';
        let model, hipBone;
        let skinMeshes = [], hairMeshes = [], breastNodes = [];

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x444444);
        
        const container = document.getElementById('viewport');
        const camera = new THREE.PerspectiveCamera(30, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(0, 1.2, 4.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enablePan = false;
        controls.target.set(0, 0.9, 0);
        controls.minDistance = 1.8;
        controls.maxDistance = 6;

        scene.add(new THREE.AmbientLight(0xffffff, 1.1));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const TOTAL_CHUNKS = 70;
        const BASE_URL = 'model/';

        async function start() {
            try {
                log("Starting sequence...");
                const chunks = [];
                for (let i = 1; i <= TOTAL_CHUNKS; i++) {
                    const url = `${BASE_URL}c${String(i).padStart(3, '0')}.bin?v=${Date.now()}`;
                    log(`Fetching chunk ${i}...`);
                    const res = await fetch(url);
                    if (!res.ok) throw new Error(`Chunk ${i} failed: ${res.status}`);
                    chunks.push(await res.arrayBuffer());
                    
                    const pct = Math.round((i / TOTAL_CHUNKS) * 100);
                    document.getElementById('loading-text').innerText = `DOWNLOADING ${pct}%`;
                    document.getElementById('loading-bar').style.width = pct + '%';
                }

                log("Assembling binary...");
                const totalLength = chunks.reduce((acc, c) => acc + c.byteLength, 0);
                const combined = new Uint8Array(totalLength);
                let offset = 0;
                chunks.forEach(c => {
                    combined.set(new Uint8Array(c), offset);
                    offset += c.byteLength;
                });

                log("Parsing 3D data...");
                const loader = new THREE.GLTFLoader();
                // Check for glTF JSON ('{') or GLB magic
                const isBinary = combined[0] === 0x67 && combined[1] === 0x6C; // 'gl'
                const data = isBinary ? combined.buffer : new TextDecoder().decode(combined);

                loader.parse(data, '', (gltf) => {
                    log("Parse successful!");
                    model = gltf.scene;
                    scene.add(model);
                    document.getElementById('loading').style.display = 'none';

                    model.traverse(node => {
                        if (node.isMesh) {
                            node.material.roughness = 0.6;
                            node.material.metalness = 0.0;
                            if (node.name.includes('Outfit') || node.name.includes('Glasses') || node.name.includes('Teeth')) node.visible = false;
                            if (node.name.includes('Skin') || node.name.includes('Body') || node.name.includes('Head') || node.name.includes('Eye')) skinMeshes.push(node);
                            if (node.name.includes('Hair')) hairMeshes.push(node);
                        }
                        if (node.name === 'Hips') hipBone = node;
                        if (node.name.toLowerCase().includes('breast')) breastNodes.push(node);
                    });
                    animate();
                }, (err) => {
                    log(`Parse Error: ${err.message}`, true);
                    document.getElementById('retry-btn').style.display = 'block';
                });

            } catch (e) {
                log(`Critical: ${e.message}`, true);
                document.getElementById('loading-text').innerText = "LOAD FAILED";
                document.getElementById('retry-btn').style.display = 'block';
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (model) {
                const sHeight = 0.88 + (state.body.height / 100) * 0.24;
                const sWeight = 0.82 + (state.body.weight / 100) * 0.36;
                const sHips = 0.75 + (state.body.hips / 100) * 0.5;
                model.scale.set(sWeight, sHeight, 1.0);
                if (hipBone) hipBone.scale.x = sHips;
                const bScale = 0.85 + (state.chest.size / 15) * 1.4;
                breastNodes.forEach(n => n.scale.setScalar(bScale));
                const sCol = new THREE.Color(SKIN_PRESETS[state.skin.preset]);
                skinMeshes.forEach(m => { if(m.material) m.material.color.copy(sCol); });
                const hCol = new THREE.Color(HAIR_COLORS[state.hair.color]);
                hairMeshes.forEach(m => { if(m.material) m.material.color.copy(hCol); });
            }
            controls.update();
            renderer.render(scene, camera);
        }

        function renderUI() {
            const tabs = document.getElementById('tabs');
            const area = document.getElementById('controls-area');
            if (!tabs || !area) return;
            tabs.innerHTML = ''; area.innerHTML = '';
            config.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (activeCat === c.id ? ' active' : '');
                btn.innerText = c.label;
                btn.onclick = () => { activeCat = c.id; renderUI(); };
                tabs.appendChild(btn);
            });
            const current = config.find(c => c.id === activeCat);
            if (current.fields) {
                current.fields.forEach(f => {
                    const div = document.createElement('div');
                    div.className = 'control-group';
                    const max = (f === 'size' && activeCat === 'chest') ? 15 : 100;
                    const val = state[activeCat][f];
                    div.innerHTML = `<div class="label"><span>${f.toUpperCase()}</span><span>${val}${max===100?"%":""}</span></div>
                        <input type="range" min="0" max="${max}" value="${val}" oninput="state.${activeCat}.${f}=this.value; renderUI();">`;
                    area.appendChild(div);
                });
            } else {
                const div = document.createElement('div');
                div.className = 'grid-options';
                current.options.forEach(opt => {
                    const btn = document.createElement('button');
                    const isSel = (state.skin.preset === opt || state.hair.color === opt || state.anatomy.vagina === opt);
                    btn.className = 'opt-btn' + (isSel ? ' active' : '');
                    btn.innerText = opt;
                    btn.onclick = () => {
                        if(activeCat === 'skin') state.skin.preset = opt;
                        else if(activeCat === 'hair') state.hair.color = opt;
                        else if(activeCat === 'anatomy') state.anatomy.vagina = opt;
                        renderUI();
                    };
                    div.appendChild(btn);
                });
                area.appendChild(div);
            }
        }
        renderUI();
        start();

        window.onresize = () => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            renderer.setSize(w, h);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        };
    </script>
</body>
</html>
